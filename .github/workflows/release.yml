name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
          
      - name: Install Dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
        
      - name: Run E2E Simulation
        run: julia --project=. examples/run_e2e.jl
        
      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp e2e_results.csv release_assets/
          cp e2e_model.xml release_assets/
          cp data/icrp89_adult_male.json release_assets/
          cd release_assets
          zip -r ../DoseFlow_Examples.zip *
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: DoseFlow_Examples.zip
